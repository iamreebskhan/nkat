name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend-typecheck-test:
    name: backend / typecheck + lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Audit (high+ severity)
        run: npm audit --audit-level=high || true     # advisory; don't block CI yet

  backend-integration-tests:
    name: backend / integration (real Postgres + pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_dev_only_change_in_prod
          POSTGRES_DB: billing_rules
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d billing_rules"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      INTEGRATION: '0'   # default: testcontainers off (we use the service containers)
      DOCKER_HOST: ''
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Apply migrations + seeds
        env:
          PGPASSWORD: admin_dev_only_change_in_prod
        run: |
          set -euo pipefail
          for f in ../db/migrations/*.sql; do
            echo "== $f =="
            psql -h localhost -U admin -d billing_rules -v ON_ERROR_STOP=1 -f "$f"
          done
          # ---- seeds: db/seed/MANIFEST order, never a glob ----------------
          # `for f in db/seed/*.sql` applied them in the filesystem's ASCII
          # order, where '-' (0x2D) sorts before '.' (0x2E), so
          # payer-rules-denial-attributes-2.sql (round 2) ran BEFORE
          # payer-rules-denial-attributes.sql (round 1). Rule seeds expire what
          # they supersede and then revive their own rows with
          # ON CONFLICT (id) DO UPDATE ... expiration_date = NULL, so whichever
          # runs last wins: CI validated a library with round 1 live on all 28
          # keys the two share, while production — which applies MANIFEST order
          # through scripts/deploy.sh — served round 2. Round 1's own header
          # records that inversion as a production incident. Glob order also ran
          # the ingestion seeds before payer-medicare.sql, leaving every
          # Medicare ingestion source with payer_id NULL and therefore inert.
          # db/test/0003_rule_supersession.sql fails if either comes back.
          SEED_DIR=../db/seed
          apply_seed() {
            echo "== $SEED_DIR/$1 =="
            psql -h localhost -U admin -d billing_rules -v ON_ERROR_STOP=1 -f "$SEED_DIR/$1"
          }
          MANIFEST_SEEDS="$(sed 's/#.*//' "$SEED_DIR/MANIFEST" | tr -d '\r' | awk 'NF')"
          # The fixtures MANIFEST deliberately keeps out of the deploy. CI still
          # applies them — tenant-demo-palliative.sql:11 says each push proves
          # they apply — and WHERE matters:
          #   * 0018 writes 15 payer_rule keys the rule library also writes.
          #     After the library it would leave TWO live rules on each, and
          #     fetchPayerRule ends in LIMIT 1, so the answer a clinician sees
          #     would depend on row order. It goes before, as glob order did.
          #   * tenant-demo-palliative.sql prices its demo superbills by reading
          #     payer_rule, so it goes after the library, as glob order did.
          # lib/__tests__/ci-seed-order-drift.spec.ts fails if a seed beside
          # MANIFEST lands in neither list.
          FIXTURES_BEFORE_RULES="0016_phase11_design_partner_subscription.sql
                                 0017_test_users.sql
                                 0018_test_palliative_payer_rules.sql
                                 0020_local_clinical_fixture.sql
                                 ingestion-source-medicare-pdf.sql"
          FIXTURES_AFTER_RULES="tenant-demo-palliative.sql"
          fixtures_done=0
          for f in $MANIFEST_SEEDS; do
            case "$f" in
              payer-rules-*)
                if [ "$fixtures_done" -eq 0 ]; then
                  for x in $FIXTURES_BEFORE_RULES; do apply_seed "$x"; done
                  fixtures_done=1
                fi
                ;;
            esac
            apply_seed "$f"
          done
          if [ "$fixtures_done" -eq 0 ]; then
            echo "::error::db/seed/MANIFEST lists no payer-rules-* seed, so the CI fixtures were never applied"
            exit 1
          fi
          for x in $FIXTURES_AFTER_RULES; do apply_seed "$x"; done
          for f in ../db/test/*.sql; do
            echo "== $f =="
            psql -h localhost -U admin -d billing_rules -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run integration tests (jest)
        env:
          INTEGRATION: '1'
          DATABASE_URL: postgres://admin:admin_dev_only_change_in_prod@localhost:5432/billing_rules
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: admin
          PGPASSWORD: admin_dev_only_change_in_prod
          PGDATABASE: billing_rules
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
        run: npm run test:integration

  schema-apply:
    name: db / migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_dev_only_change_in_prod
          POSTGRES_DB: billing_rules
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d billing_rules"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: admin_dev_only_change_in_prod
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            echo "== $f =="
            psql -h localhost -U admin -d billing_rules -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Apply seed data
        env:
          PGPASSWORD: admin_dev_only_change_in_prod
        run: |
          set -euo pipefail
          # Order comes from db/seed/MANIFEST — the same file scripts/deploy.sh
          # walks — so the rule library this job validates is the one production
          # applies. See the identical block in backend-integration-tests above
          # for the incident that made a glob here a bug: rule seeds supersede
          # each other, so ASCII order put round 1 of the denial-attributes pair
          # last and CI served the older UnitedHealthcare Ohio rule on all 28
          # keys the two share. db/test/0003_rule_supersession.sql now fails on
          # that, and on the Medicare ingestion sources glob order left unbound.
          SEED_DIR=db/seed
          apply_seed() {
            echo "== $SEED_DIR/$1 =="
            psql -h localhost -U admin -d billing_rules -v ON_ERROR_STOP=1 -f "$SEED_DIR/$1"
          }
          MANIFEST_SEEDS="$(sed 's/#.*//' "$SEED_DIR/MANIFEST" | tr -d '\r' | awk 'NF')"
          # 0018 writes payer_rule keys the library also writes, so it must come
          # before the library or both stay live and fetchPayerRule's LIMIT 1
          # picks arbitrarily; tenant-demo-palliative.sql reads payer_rule to
          # price its superbills, so it must come after.
          FIXTURES_BEFORE_RULES="0016_phase11_design_partner_subscription.sql
                                 0017_test_users.sql
                                 0018_test_palliative_payer_rules.sql
                                 0020_local_clinical_fixture.sql
                                 ingestion-source-medicare-pdf.sql"
          FIXTURES_AFTER_RULES="tenant-demo-palliative.sql"
          fixtures_done=0
          for f in $MANIFEST_SEEDS; do
            case "$f" in
              payer-rules-*)
                if [ "$fixtures_done" -eq 0 ]; then
                  for x in $FIXTURES_BEFORE_RULES; do apply_seed "$x"; done
                  fixtures_done=1
                fi
                ;;
            esac
            apply_seed "$f"
          done
          if [ "$fixtures_done" -eq 0 ]; then
            echo "::error::db/seed/MANIFEST lists no payer-rules-* seed, so the CI fixtures were never applied"
            exit 1
          fi
          for x in $FIXTURES_AFTER_RULES; do apply_seed "$x"; done
      - name: Run schema tests
        env:
          PGPASSWORD: admin_dev_only_change_in_prod
        run: |
          set -euo pipefail
          for f in db/test/*.sql; do
            echo "== $f =="
            psql -h localhost -U admin -d billing_rules -v ON_ERROR_STOP=1 -f "$f"
          done

  lambda-scrubber-tests:
    name: lambda / datadog forwarder PHI scrubber
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/lambda/datadog-forwarder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run node:test PHI scrubber suite
        run: node --test index.test.js

  extension-e2e:
    name: extension / Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    needs: extension-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Build extension
        run: npm run build
      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E (xvfb wraps headed Chromium)
        run: xvfb-run -a npm run test:e2e
      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: browser-extension/test-results
          retention-days: 14

  extension-typecheck-test:
    name: extension / typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Build (esbuild bundle)
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-dist
          path: browser-extension/dist
          retention-days: 30

  openapi-export:
    name: backend / openapi export drift check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Re-export OpenAPI
        run: npm run openapi:export
      - name: Fail on uncommitted drift
        # The export script writes to <repo>/docs/openapi.json (top-level),
        # but this job runs in the backend/ working directory — so we point
        # at ../docs/openapi.json explicitly.
        run: |
          if ! git diff --quiet ../docs/openapi.json; then
            echo "::error::docs/openapi.json is out of date — run 'npm run openapi:export' and commit"
            git diff ../docs/openapi.json
            exit 1
          fi

  gold-standard-eval:
    name: ai / gold-standard eval (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Run gold-standard eval (fails if pass rate < 90%)
        # Hits live Anthropic + OpenAI. Skips gracefully when the
        # secrets aren't configured (forks / contributors) so CI stays
        # green; enforce by adding ANTHROPIC_API_KEY + OPENAI_API_KEY
        # to the repo's Actions secrets.
        env:
          EVAL: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # lib/env.ts validates the FULL schema eagerly on first env()
          # call. The parser-only eval never touches the DB/auth, but
          # these two are required (no default) so supply inert
          # placeholders or env() throws before any Anthropic call.
          DATABASE_URL: "postgres://eval:eval@localhost:5432/eval"
          JWT_SECRET: "ci_eval_placeholder_secret_min_32_chars_long"
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set — skipping gold-standard eval. Add it to Actions secrets to enforce the ≥90% gate."
            exit 0
          fi
          npx vitest run gold-standard
